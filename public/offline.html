<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Pocket Pilot — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --surface: #ffffff;
        --line: rgba(148, 163, 184, 0.35);
        --text: #0f172a;
        --muted: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --surface: #0f172a;
          --line: rgba(51, 65, 85, 0.8);
          --text: #f1f5f9;
          --muted: #94a3b8;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(circle at 100% -10%, rgba(16, 185, 129, 0.14), transparent 40%),
          radial-gradient(circle at -10% 10%, rgba(56, 189, 248, 0.12), transparent 38%),
          var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 26rem;
        padding: 2rem 1.75rem;
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        box-shadow: 0 24px 60px -28px rgba(2, 6, 23, 0.45);
        text-align: center;
      }
      .badge {
        display: grid;
        place-items: center;
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: rgba(16, 185, 129, 0.12);
        color: #059669;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 0.875rem; line-height: 1.6; color: var(--muted); }
      button {
        margin-top: 1.5rem;
        width: 100%;
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 0.75rem;
        background: #10b981;
        color: #020617;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #34d399; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8.82a15 15 0 0 1 20 0" />
          <path d="M5 12.86a10 10 0 0 1 14 0" />
          <path d="M8.5 16.43a5 5 0 0 1 7 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
          <line x1="2" y1="2" x2="22" y2="22" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Pocket Pilot can't reach the internet right now. Pages you've already visited are still available from
        your device cache.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
